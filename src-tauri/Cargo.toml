[package]
name = "vtk-viewer"
version = "0.1.7"
description = "24 galvo VTK viewer"
authors = ["wuqmWork"]
edition = "2021"

[lib]
name = "vtk_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

rayon = "1.10"
lexical-core = "1.0"
